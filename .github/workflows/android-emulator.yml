name: VEXA Android Live Phone

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      rotation_minutes:
        description: 'Minutes to keep this emulator active (default: 240)'
        required: false
        default: '240'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: vexa-android-emulator
  cancel-in-progress: true

jobs:
  run-emulator:
    name: Boot Android Emulator & Expose Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 255
    env:
      EMULATOR_ACCESS_TOKEN: ${{ secrets.EMULATOR_ACCESS_TOKEN }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
      ROTATION_MINUTES: ${{ inputs.rotation_minutes || '240' }}
      # Persistence (whole-AVD via GitHub Releases, VIBELY architecture)
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ANDROID_STATE_BRANCH: android-state-v1
      AVD_NAME: vexa_pixel_7_api34
      ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout VEXA
        uses: actions/checkout@v4
        with:
          ref: vexa

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "KVM device not available - emulator may use software rendering"

      - name: Install cloudflared & gateway dependencies
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared || sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cd android-emulator && npm ci

      - name: Restore whole-AVD checkpoint from GitHub Release (if available)
        if: env.EMULATOR_STATE_KEY != '' && env.GH_PAT != ''
        run: |
          export PYTHONPATH="$PWD/android-emulator${PYTHONPATH:+:$PYTHONPATH}"
          bash "$PWD/android-emulator/restore-whole-avd.sh" || true
        env:
          AVD_NAME: vexa_pixel_7_api34

      - name: Boot Android Emulator (Pixel 7, Android 14, Play Store)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          avd-name: vexa_pixel_7_api34
          force-avd-creation: ${{ (env.EMULATOR_STATE_KEY == '' || env.GH_PAT == '') && 'true' || 'false' }}
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            # Wait for ADB device to be ready
            echo "Waiting for Android emulator to be online..."
            for i in $(seq 1 120); do
              STATE=$(adb get-state 2>/dev/null || echo "unknown")
              if [ "$STATE" = "device" ]; then
                echo "Emulator is online!"
                break
              fi
              sleep 5
            done

            # Grant ADB permissions and wait for boot completion
            adb wait-for-device
            adb shell settings put global adb_enabled 1
            for i in $(seq 1 60); do
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$BOOT" = "1" ]; then
                echo "Android boot completed!"
                break
              fi
              sleep 5
            done

            # Start VEXA ADB Bridge AFTER emulator is ready
            PORT=8080 node android-emulator/vexa-bridge.mjs > /tmp/gateway.log 2>&1 &
            BRIDGE_PID=$!
            echo "VEXA ADB Bridge PID: $BRIDGE_PID"
            sleep 3

            # Start cloudflared tunnel
            cloudflared tunnel --url http://localhost:8080 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
            TUNNEL_PID=$!
            echo "Cloudflare tunnel PID: $TUNNEL_PID"

            # Wait for tunnel URL
            GATEWAY_URL=""
            for i in $(seq 1 30); do
              GATEWAY_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
              if [ -n "$GATEWAY_URL" ]; then
                echo "Live Gateway URL: $GATEWAY_URL"
                break
              fi
              sleep 2
            done

            # Publish gateway URL to data/emulator.json
            if [ -n "$GATEWAY_URL" ]; then
              python3 - "$GATEWAY_URL" << 'EOF'
              import json, datetime, os, sys
              gateway_url = sys.argv[1]
              p = "data/emulator.json"
              with open(p) as f:
                  d = json.load(f)
              d["gatewayUrl"] = gateway_url
              d["status"] = "online"
              d["lastHeartbeat"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              d["activeRunId"] = os.environ.get("GITHUB_RUN_ID")
              d["updatedAt"] = d["lastHeartbeat"]
              with open(p, "w") as f:
                  json.dump(d, f, indent=2)
                  f.write("\n")
              EOF
              git config user.name "VEXA Emulator"
              git config user.email "emulator@vexa.ai"
              git add data/emulator.json
              git commit -m "emulator: publish live gateway URL [skip ci]" || true
              git pull --rebase origin vexa || true
              git push origin vexa || true
            fi

            # Keep emulator alive for the rotation period
            echo "Emulator running. Keeping alive for ${ROTATION_MINUTES:-240} minutes..."
            sleep $(( ${ROTATION_MINUTES:-240} * 60 ))

            # --- Save whole-AVD checkpoint before shutdown (persistence) ---
            if [ "${EMULATOR_STATE_KEY:-}" != "" ] && [ "${GH_PAT:-}" != "" ]; then
              echo "[save-checkpoint] Capturing whole-AVD checkpoint before shutdown..."
              export PYTHONPATH="$PWD/android-emulator${PYTHONPATH:+:$PYTHONPATH}"
              export CHECKPOINT_HOLD=true
              bash "$PWD/android-emulator/save-whole-avd.sh" || echo "[save-checkpoint] WARNING: checkpoint save failed (non-fatal)"
            else
              echo "[save-checkpoint] Skipping: EMULATOR_STATE_KEY or GH_PAT not configured"
            fi

            # Clean shutdown
            kill $BRIDGE_PID 2>/dev/null || true
            kill $TUNNEL_PID 2>/dev/null || true
            adb emu kill 2>/dev/null || true
