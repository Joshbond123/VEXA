name: VEXA Android Live Phone

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      rotation_minutes:
        description: 'Minutes to keep this emulator active (default: 240 for 4-hour rotation)'
        required: false
        default: '240'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: vexa-android-emulator
  cancel-in-progress: false

jobs:
  run-emulator:
    name: Boot Android Emulator & Register with Cloudflare Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      EMULATOR_ACCESS_TOKEN: ${{ secrets.EMULATOR_ACCESS_TOKEN }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
      ROTATION_MINUTES: ${{ inputs.rotation_minutes || '240' }}
      # Persistence (whole-AVD via GitHub Releases, VIBELY architecture)
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ANDROID_STATE_BRANCH: android-state-v1
      AVD_NAME: vexa_pixel_7_api34
      # Cloudflare Worker gateway (permanent endpoint)
      CLOUDFLARE_WORKER_URL: https://vexa-ai-agent.replyraven001.workers.dev

    steps:
      - name: Checkout VEXA
        uses: actions/checkout@v4
        with:
          ref: vexa
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "KVM device not available - emulator may use software rendering"

      - name: Install ffmpeg for headless screenshot extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          echo "ffmpeg installed successfully"

      - name: Install gateway dependencies
        run: |
          cd android-emulator && npm ci

      - name: Restore whole-AVD checkpoint from VIBELY (Google account pre-provisioned)
        if: env.EMULATOR_STATE_KEY != '' && env.GH_PAT != ''
        run: |
          export PYTHONPATH="$PWD/android-emulator${PYTHONPATH:+:$PYTHONPATH}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          # Restore from VIBELY repo which has pre-provisioned AVD with Google account
          GITHUB_REPOSITORY=Joshbond123/VIBELY bash "$PWD/android-emulator/restore-whole-avd.sh" || true
        env:
          AVD_NAME: vexa_pixel_7_api34
          ANDROID_STATE_BRANCH: android-state-v1

      - name: Boot Android Emulator (Pixel 7, Android 14, Play Store)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          avd-name: vexa_pixel_7_api34
          force-avd-creation: ${{ (env.EMULATOR_STATE_KEY == '' || env.GH_PAT == '') && 'true' || 'false' }}
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          # -no-window required for headless CI. Screenshots captured via
          # adb screenrecord + ffmpeg frame extraction (works headless).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash android-emulator/run-emulator-session.sh

      - name: Notify Cloudflare of emulator shutdown
        if: always()
        run: |
          curl -s -X DELETE "${CLOUDFLARE_WORKER_URL}/api/emulator/session" > /dev/null 2>&1 || true
          echo "Emulator session cleanup complete."
