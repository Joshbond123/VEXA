name: VEXA Android Live Phone

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      rotation_minutes:
        description: 'Minutes to keep this emulator active (default: 240 for 4-hour rotation)'
        required: false
        default: '240'
        type: string
      restore_state:
        description: 'Restore the persisted AVD checkpoint before boot (true/false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: vexa-android-emulator
  cancel-in-progress: false

jobs:
  run-emulator:
    name: Boot Android Emulator & Register with Cloudflare Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      EMULATOR_ACCESS_TOKEN: ${{ secrets.EMULATOR_ACCESS_TOKEN }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
      ROTATION_MINUTES: ${{ inputs.rotation_minutes || '240' }}
      RESTORE_STATE: ${{ inputs.restore_state || 'false' }}
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ANDROID_STATE_BRANCH: android-state-v1
      AVD_NAME: vexa_android
      CLOUDFLARE_WORKER_URL: https://vexa-ai-agent.replyraven001.workers.dev
      ANDROID_HOME: /usr/local/lib/android/sdk
      MOBILERUN_PORT: '8765'
      MOBILERUN_BRIDGE: http://127.0.0.1:8765

    steps:
      - name: Checkout VEXA
        uses: actions/checkout@v4
        with:
          ref: vexa
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm 2>&1 || echo "KVM not available - will use software rendering"

      - name: Install dependencies
        run: |
          # apt on this runner intermittently fails with
          # "Could not wait for server fd - select (11: Resource temporarily
          # unavailable)" against security.ubuntu.com. That single transient
          # error killed run 45 and with it the whole 4-hour rotation, leaving
          # the site reporting the emulator offline for 10+ hours.
          #
          # Nothing here is strictly required for the boot: the runner image
          # already ships curl/wget/unzip and the JDK, and ffmpeg is only used
          # for the optional downscaled preview. So: retry with backoff, then
          # continue without the optional packages rather than failing the job.
          set -uo pipefail
          ok=false
          for attempt in 1 2 3; do
            if sudo apt-get update -qq -o Acquire::Retries=3 \
               && sudo apt-get install -y -qq -o Acquire::Retries=3 \
                    ffmpeg openjdk-17-jdk wget unzip curl; then
              ok=true
              break
            fi
            echo "::warning::apt attempt $attempt failed; retrying in $((attempt * 15))s"
            sudo rm -rf /var/lib/apt/lists/partial || true
            sleep $((attempt * 15))
          done
          if [ "$ok" != "true" ]; then
            echo "::warning::apt install failed after 3 attempts; continuing with the preinstalled toolchain"
          fi
          # Hard requirements only.
          for bin in curl wget unzip java; do
            command -v "$bin" >/dev/null 2>&1 || { echo "::error::$bin is missing and cannot be installed"; exit 1; }
          done
          command -v ffmpeg >/dev/null 2>&1 || echo "::warning::ffmpeg unavailable; preview will fall back to the full PNG"
          echo "Dependencies ready"

      - name: Install Android SDK Command-line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          # Capital -O writes the file. A lowercase -o writes a wget log and leaves
          # an empty file, which is what broke this step (run 44274019317).
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # platform-tools + emulator are needed by every path; the system image
          # is chosen in the boot step so a missing Play image can fall back.
          sdkmanager "platform-tools" "emulator" "build-tools;34.0.0" 2>&1 | tail -5
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install gateway + mobilerun dependencies
        run: |
          cd android-emulator && npm ci
          python -m pip install --upgrade pip
          # The slim driver package provides the `mobilerun_core_local` namespace.
          # The full `mobilerun` distribution (which provides `mobilerun.tools`)
          # pulls in llama-index and is not needed to drive a device over ADB.
          python -m pip install "mobilerun-core-local>=0.7.2" 2>&1 | tail -5
          python -c "from mobilerun_core_local import AndroidDriver; print('mobilerun AndroidDriver import OK')"

      - name: Restore whole-AVD checkpoint (optional)
        if: env.RESTORE_STATE == 'true' && env.EMULATOR_STATE_KEY != '' && env.GH_PAT != ''
        run: |
          export PYTHONPATH="$PWD/android-emulator${PYTHONPATH:+:$PYTHONPATH}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          bash "$PWD/android-emulator/restore-whole-avd.sh" || echo "checkpoint restore skipped (non-fatal)"
        env:
          AVD_NAME: vexa_android

      - name: Boot emulator (Play Store image preferred)
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          bash android-emulator/boot-emulator.sh
          # Surface what actually booted to later steps.
          cat /tmp/vexa-boot.env >> "$GITHUB_ENV"

      - name: Make the device look and behave like a real phone
        run: |
          bash android-emulator/real-device-profile.sh

      - name: Verify Google Play Store
        run: |
          # The Play Store ships inside the google_apis_playstore system image, so
          # "installing" it means booting that image — there is nothing to
          # side-load. This step proves what is actually on the device instead of
          # assuming the image choice worked.
          set -uo pipefail
          echo "--- packages ---"
          adb shell pm list packages 2>/dev/null | grep -E "com\.android\.vending|com\.google\.android\.gms|com\.google\.android\.gsf" || echo "(none found)"

          if adb shell pm list packages 2>/dev/null | grep -q "com.android.vending"; then
            echo "PLAY_STORE_PRESENT=true" >> "$GITHUB_ENV"
            VER=$(adb shell dumpsys package com.android.vending 2>/dev/null | grep -m1 versionName | tr -d '\r')
            echo "Play Store present ($VER)"
            # Report sign-in state honestly: the store opens and browses without
            # an account, but downloads require one.
            if adb shell dumpsys account 2>/dev/null | grep -q "com.google"; then
              echo "Google account present on device"
            else
              echo "::notice::No Google account on the device — the Play Store opens and browses, but app downloads need a signed-in account"
            fi
            adb shell monkey -p com.android.vending -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
            sleep 4
            adb shell dumpsys activity activities 2>/dev/null | grep -m1 -E "mResumedActivity|topResumedActivity" | tr -d '\r' || true
          else
            echo "PLAY_STORE_PRESENT=false" >> "$GITHUB_ENV"
            echo "::warning::Play Store not present — booted the fallback image"
          fi

      - name: Run VEXA Emulator Session
        run: |
          bash android-emulator/run-emulator-session.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            /tmp/emulator.log
            /tmp/gateway.log
            /tmp/mobilerun-bridge.log
            /tmp/session.log
          if-no-files-found: ignore

      - name: Notify Cloudflare of emulator shutdown
        if: always()
        run: |
          curl -s -X DELETE "${CLOUDFLARE_WORKER_URL}/api/emulator/session" > /dev/null 2>&1 || true
          echo "Emulator session cleanup complete."
