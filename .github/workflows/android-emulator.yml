name: VEXA Android Live Phone

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      rotation_minutes:
        description: 'Minutes to keep this emulator active (default: 240 for 4-hour rotation)'
        required: false
        default: '240'
        type: string
      restore_state:
        description: 'Restore the persisted AVD checkpoint before boot (true/false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: vexa-android-emulator
  cancel-in-progress: false

jobs:
  run-emulator:
    name: Boot Android Emulator & Register with Cloudflare Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      EMULATOR_ACCESS_TOKEN: ${{ secrets.EMULATOR_ACCESS_TOKEN }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
      ROTATION_MINUTES: ${{ inputs.rotation_minutes || '240' }}
      RESTORE_STATE: ${{ inputs.restore_state || 'false' }}
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ANDROID_STATE_BRANCH: android-state-v1
      AVD_NAME: vexa_android_28
      CLOUDFLARE_WORKER_URL: https://vexa-ai-agent.replyraven001.workers.dev
      ANDROID_HOME: /usr/local/lib/android/sdk
      MOBILERUN_PORT: '8765'
      MOBILERUN_BRIDGE: http://127.0.0.1:8765

    steps:
      - name: Checkout VEXA
        uses: actions/checkout@v4
        with:
          ref: vexa
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm 2>&1 || echo "KVM not available - will use software rendering"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg openjdk-17-jdk wget unzip curl
          echo "Dependencies installed"

      - name: Install Android SDK Command-line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          # Capital -O writes the file. A lowercase -o writes a wget log and leaves
          # an empty file, which is what broke this step (run 44274019317).
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK (API 28 - smaller, faster boot)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "platforms;android-28" "system-images;android-28;google_apis;x86_64" "build-tools;28.0.3" 2>&1 | tail -10
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Create AVD (API 28, google_apis, x86_64)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          # avdmanager and the emulator must agree on where AVDs live. Without
          # this, avdmanager wrote the AVD to its own default location while the
          # boot step looked in ANDROID_AVD_HOME and failed with
          # "Unknown AVD name [vexa_android_28]".
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "no" | avdmanager create avd -n "$AVD_NAME" \
            -k "system-images;android-28;google_apis;x86_64" \
            -d "pixel_2" \
            --force
          test -f "$ANDROID_AVD_HOME/$AVD_NAME.ini" || {
            echo "::error::AVD $AVD_NAME.ini missing from $ANDROID_AVD_HOME"
            ls -la "$ANDROID_AVD_HOME" || true
            exit 1
          }
          echo "AVD created: $AVD_NAME"
          emulator -list-avds

      - name: Install gateway + mobilerun dependencies
        run: |
          cd android-emulator && npm ci
          python -m pip install --upgrade pip
          # The slim driver package provides the `mobilerun_core_local` namespace.
          # The full `mobilerun` distribution (which provides `mobilerun.tools`)
          # pulls in llama-index and is not needed to drive a device over ADB.
          python -m pip install "mobilerun-core-local>=0.7.2" 2>&1 | tail -5
          python -c "from mobilerun_core_local import AndroidDriver; print('mobilerun AndroidDriver import OK')"

      - name: Restore whole-AVD checkpoint (optional)
        if: env.RESTORE_STATE == 'true' && env.EMULATOR_STATE_KEY != '' && env.GH_PAT != ''
        run: |
          export PYTHONPATH="$PWD/android-emulator${PYTHONPATH:+:$PYTHONPATH}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          bash "$PWD/android-emulator/restore-whole-avd.sh" || echo "checkpoint restore skipped (non-fatal)"
        env:
          AVD_NAME: vexa_android_28
          ANDROID_STATE_BRANCH: android-state-v1

      - name: Start Android Emulator (headless, software GPU)
        run: |
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          echo "Starting emulator (API 28, google_apis, x86_64, headless)..."
          nohup emulator -avd "$AVD_NAME" \
            -no-window -gpu swiftshader_indirect \
            -noaudio -no-boot-anim -no-snapshot \
            -no-snapshot-save -no-snapshot-load \
            -memory 2048 -cores 2 \
            > /tmp/emulator.log 2>&1 &
          echo "Emulator PID: $!"

          adb start-server
          echo "Waiting for adb device..."
          DEVICE_SEEN=false
          for i in $(seq 1 120); do
            if adb devices 2>/dev/null | grep -q "emulator-5554.*device"; then
              echo "adb device found: emulator-5554"; DEVICE_SEEN=true; break
            fi
            sleep 5
          done
          if [ "$DEVICE_SEEN" != "true" ]; then
            echo "::error::adb never saw emulator-5554"
            adb devices || true
            echo "----- /tmp/emulator.log (tail) -----"
            tail -n 80 /tmp/emulator.log || true
            exit 1
          fi

          echo "Waiting for boot completion..."
          BOOTED=false
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "0")
            if [ "$BOOT" = "1" ]; then echo "Android boot completed!"; BOOTED=true; break; fi
            sleep 5
          done
          if [ "$BOOTED" != "true" ]; then
            echo "::error::Android did not finish booting in 10 minutes"
            echo "----- /tmp/emulator.log (tail) -----"
            tail -n 80 /tmp/emulator.log || true
            exit 1
          fi

          adb shell input keyevent 82 || true
          adb shell wm dismiss-keyguard || true
          adb shell getprop ro.product.model || true
          adb shell getprop ro.build.version.release || true
          adb shell wm size || true

      - name: Run VEXA Emulator Session
        run: |
          bash android-emulator/run-emulator-session.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            /tmp/emulator.log
            /tmp/gateway.log
            /tmp/mobilerun-bridge.log
            /tmp/session.log
          if-no-files-found: ignore

      - name: Notify Cloudflare of emulator shutdown
        if: always()
        run: |
          curl -s -X DELETE "${CLOUDFLARE_WORKER_URL}/api/emulator/session" > /dev/null 2>&1 || true
          echo "Emulator session cleanup complete."
