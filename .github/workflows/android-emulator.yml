name: VEXA Android Live Phone

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      rotation_minutes:
        description: 'Minutes to keep this emulator active (default: 240 for 4-hour rotation)'
        required: false
        default: '240'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: vexa-android-emulator
  cancel-in-progress: false

jobs:
  run-emulator:
    name: Boot Android Emulator & Register with Cloudflare Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      EMULATOR_ACCESS_TOKEN: ${{ secrets.EMULATOR_ACCESS_TOKEN }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
      ROTATION_MINUTES: ${{ inputs.rotation_minutes || '240' }}
      EMULATOR_STATE_KEY: ${{ secrets.EMULATOR_STATE_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ANDROID_STATE_BRANCH: android-state-v1
      AVD_NAME: vexa_android_28
      CLOUDFLARE_WORKER_URL: https://vexa-ai-agent.replyraven001.workers.dev

    steps:
      - name: Checkout VEXA
        uses: actions/checkout@v4
        with:
          ref: vexa
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm 2>&1 || echo "KVM not available - will use software rendering"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg openjdk-17-jdk wget unzip curl
          echo "Dependencies installed"

      - name: Install Android SDK Command-line Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          file cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version

      - name: Install Android SDK (API 28 - smaller, faster boot)
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses 2>&1 | tail -5
          sdkmanager "platform-tools" "emulator" "platforms;android-28" "system-images;android-28;google_apis;x86" "build-tools;28.0.3" 2>&1 | tail -10

      - name: Create AVD (API 28, google_apis, x86)
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "no" | avdmanager create avd -n vexa_android_28 \
            -k "system-images;android-28;google_apis;x86" \
            -g google_apis \
            -b x86 \
            -d "pixel_2" \
            --force
          echo "AVD created: vexa_android_28"

      - name: Install gateway dependencies
        run: |
          cd android-emulator && npm ci

      - name: Restore whole-AVD checkpoint from VIBELY
        if: env.EMULATOR_STATE_KEY != '' && env.GH_PAT != ''
        run: |
          export PYTHONPATH="$PWD/android-emulator${PYTHONPATH:+:$PYTHONPATH}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          GITHUB_REPOSITORY=Joshbond123/VIBELY bash "$PWD/android-emulator/restore-whole-avd.sh" || true
        env:
          AVD_NAME: vexa_android_28
          ANDROID_STATE_BRANCH: android-state-v1

      - name: Start Android Emulator (headless, no-window)
        run: |
          export ANDROID_HOME=$HOME/Android/Sdk
          export PATH=$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export AVD_NAME=vexa_android_28

          echo "Starting emulator (API 28, google_apis, x86, headless)..."
          nohup emulator -avd "$AVD_NAME" \
            -no-window -gpu swiftshader_indirect \
            -noaudio -no-boot-anim -no-snapshot-save \
            -memory 2048 \
            > /tmp/emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "Emulator PID: $EMULATOR_PID"

          # Wait for adb device
          echo "Waiting for adb device..."
          for i in $(seq 1 100); do
            if adb devices 2>/dev/null | grep -q "emulator-5554.*device"; then
              echo "adb device found: emulator-5554"
              break
            fi
            sleep 5
          done

          # Wait for boot completion
          echo "Waiting for boot completion..."
          for i in $(seq 1 100); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "0")
            if [ "$BOOT" = "1" ]; then
              echo "Android boot completed!"
              break
            fi
            sleep 5
          done

          # Verify device info
          adb shell getprop ro.product.model 2>&1 || true
          adb shell getprop ro.build.version.release 2>&1 || true
          adb shell wm size 2>&1 || true
          adb shell input keyevent 82 2>&1 || true

      - name: Run VEXA Emulator Session
        run: |
          bash android-emulator/run-emulator-session.sh

      - name: Notify Cloudflare of emulator shutdown
        if: always()
        run: |
          curl -s -X DELETE "${CLOUDFLARE_WORKER_URL}/api/emulator/session" > /dev/null 2>&1 || true
          echo "Emulator session cleanup complete."
