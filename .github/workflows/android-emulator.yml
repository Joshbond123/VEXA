name: VEXA Android Live Phone

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      rotation_minutes:
        description: 'Minutes to keep this emulator active (default: 240)'
        required: false
        default: '240'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: vexa-android-emulator
  cancel-in-progress: true

jobs:
  run-emulator:
    name: Boot Android Emulator & Expose Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      EMULATOR_ACCESS_TOKEN: ${{ secrets.EMULATOR_ACCESS_TOKEN }}
      EMULATOR_GATEWAY_SECRET: ${{ secrets.EMULATOR_GATEWAY_SECRET }}
      ROTATION_MINUTES: ${{ inputs.rotation_minutes || '240' }}

    steps:
      - name: Checkout VEXA
        uses: actions/checkout@v4
        with:
          ref: vexa

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install cloudflared & gateway dependencies
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared || sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cd android-remote-gateway && npm ci && npm run build
          cd ../android-emulator && npm ci

      - name: Start Gateway & Cloudflare Tunnel
        id: tunnel
        run: |
          mkdir -p /tmp/vexa-data
          PORT=8080 DATA_DIR=/tmp/vexa-data node android-remote-gateway/dist/server.js > /tmp/gateway.log 2>&1 &
          sleep 3
          cloudflared tunnel --url http://localhost:8080 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "gateway_url=$URL" >> "$GITHUB_OUTPUT"
              echo "Live Gateway URL: $URL"
              break
            fi
            sleep 2
          done

      - name: Publish Gateway URL to data/emulator.json
        if: steps.tunnel.outputs.gateway_url != ''
        run: |
          python3 - << 'EOF'
          import json, datetime, os
          p = "data/emulator.json"
          with open(p) as f:
              d = json.load(f)
          d["gatewayUrl"] = os.environ["GW_URL"]
          d["status"] = "online"
          d["lastHeartbeat"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          d["activeRunId"] = os.environ.get("GITHUB_RUN_ID")
          d["updatedAt"] = d["lastHeartbeat"]
          with open(p, "w") as f:
              json.dump(d, f, indent=2)
              f.write("\n")
          EOF
          git config user.name "VEXA Emulator"
          git config user.email "emulator@vexa.ai"
          git add data/emulator.json
          git commit -m "emulator: publish live gateway URL [skip ci]" || true
          git pull --rebase origin vexa || true
          git push origin vexa
        env:
          GW_URL: ${{ steps.tunnel.outputs.gateway_url }}

      - name: Boot Android Emulator & Connect Agent
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            echo "Android Emulator booted! Connecting VEXA device agent..."
            EMULATOR_GATEWAY_URL="http://localhost:8080" node android-emulator/agent.mjs
