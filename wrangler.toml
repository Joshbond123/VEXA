name = "vexa-colab"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "vexa_colab"
database_id = "30de7433-63a3-48f0-a06b-b8ecd5fd573b"

[[durable_objects.bindings]]
name = "GPU"
class_name = "GpuHub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GpuHub"]


# Kaggle runtime source is embedded at build time (see src/kernel.js).
[[rules]]
type = "Text"
globs = ["**/*.py"]
fallthrough = true

[vars]
PUBLIC_BASE_URL = "https://vexa-colab.adeniranj787.workers.dev"
KAGGLE_USER = "black797"
KERNEL_SLUG = "black797/vexa-kaggle-gpu-runtime"
MODEL_DATASET = "black797/vexa-qwen38-q6k"
MODEL_FILE = "Qwen3.8-27B-Uncensored-Q6_K.gguf"
MODEL_BYTES = "22430999968"
MODEL_SHA256 = ""
MODEL_SERVED_ID = "qwen3.8-27b-uncensored-q6_k"
CTX_SIZE = "65536"
PARALLEL_SLOTS = "2"
IDLE_TIMEOUT_MINUTES = "20"

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
head_sampling_rate = 1
